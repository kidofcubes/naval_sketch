[package]
name = "naval_sketch"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
csv = "1.4"
dirs = "6.0"
enum-collections = "1.7"
quick-xml = "0.39"
regex = "1.12"

serde = { version = "1.0", features = ["derive"] }
yaml-rust2 = "0.11"
serde_json = "1.0"
anyhow = {  version = "1.0" , features = ["backtrace"]}

futures-lite = "2.6"
bevy = { version = "0.18", features = ["dynamic_linking", "wayland"], optional = true }

#[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", features = ["blocking", "form"] }
glam = "0.30"
# tokio = { version = "1.44.1", features = ["full"] }

