[workspace]
members = [
    "crates/naval_sketch",
    "crates/naval_edit",
]
resolver = "2"


# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 'z'
