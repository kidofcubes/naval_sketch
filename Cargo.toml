[package]
name = "naval_sketch"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
bevy = { version = "0.18.0", features = ["dynamic_linking", "wayland"]}
bevy_egui = "0.39.1"
chrono = "0.4.43"
csv = "1.4.0"
dirs = "6.0.0"
enum-collections = "1.7.0"
quick-xml = "0.39.0"
rand = "0.10.0"
regex = "1.12.3"

serde = "1.0.228"
smol_str = "*"
# transform-gizmo-bevy = "0.5.1"
yaml-rust2 = "0.11.0"
serde_json = "1.0"
 
#eframe = "0.33"
#emath = "0.33"
#epaint = "0.33"
#ecolor = "0.33"
#glam = { version = "0.31.0", features = ["mint"] }
#mint = "0.5"
#enum_dispatch = "0.3.13"
#ahash = "0.8.12"
#enumset = "1.1.10"
#bytemuck = "1.25"
#uuid = "1.20"
futures-lite = "2.6.1"
anyhow = {  version = "1.0.101" , features = ["backtrace"]}
#log = "0.4.29"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.2", features = ["blocking", "form"] }
# tokio = { version = "1.44.1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.1", features = ["wasm_js"] }
web-sys = { version = "0.3.85", features = ["Window", "Location", "Document", "File"] }
wasm-bindgen = "0.2.108"
gloo-net = "0.6.0"
console_log = { version = "1.0.0", features = ["color"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4.58"
pollster = "0.4.0"

# [target.wasm32-unknown-unknown]
# runner = "wasm-server-runner"

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 'z'
